name: Release installer

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      version:
        description: Installer version in Major.Minor.Patch form
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-installer:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          $rawVersion = if ('${{ github.event_name }}' -eq 'release') { '${{ github.event.release.tag_name }}' } else { '${{ inputs.version }}' }
          ./scripts/Resolve-ReleaseVersion.ps1 -Version $rawVersion

      - name: Build .NET release assets
        id: app_release
        shell: pwsh
        run: |
          ./scripts/Build-AppRelease.ps1 -InstallerVersion '${{ steps.version.outputs.installer_version }}'

      - name: Upload complete .NET application workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: dotnet-app-win-x64
          path: ${{ steps.app_release.outputs.app_publish_path }}

      - name: Upload MSI workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.app_release.outputs.msi_name }}
          path: ${{ steps.app_release.outputs.msi_path }}

      - name: Upload setup workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.app_release.outputs.setup_name }}
          path: ${{ steps.app_release.outputs.setup_path }}

      - name: Upload release assets
        if: github.event_name == 'release'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload ${{ steps.version.outputs.release_tag }} "${{ steps.app_release.outputs.msi_path }}#${{ steps.app_release.outputs.msi_name }}" --clobber
          gh release upload ${{ steps.version.outputs.release_tag }} "${{ steps.app_release.outputs.setup_path }}#${{ steps.app_release.outputs.setup_name }}" --clobber
