name: Release C executable

on:
  release:
    types:
      - published
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-c:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build C release asset
        id: c_release
        shell: pwsh
        run: |
          ./scripts/Build-CRelease.ps1

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.c_release.outputs.exe_name }}
          path: ${{ steps.c_release.outputs.exe_path }}

      - name: Upload C executable to GitHub release
        if: github.event_name == 'release'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload ${{ github.event.release.tag_name }} "${{ steps.c_release.outputs.exe_path }}#${{ steps.c_release.outputs.exe_name }}" --clobber
