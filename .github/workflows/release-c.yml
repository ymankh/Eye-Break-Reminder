name: Release C executable

on:
  release:
    types:
      - published
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-c:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure C project
        run: cmake -S c -B c/build -DCMAKE_BUILD_TYPE=Release

      - name: Build C executable
        run: cmake --build c/build --config Release

      - name: Locate C executable
        id: executable
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path c/build -Recurse -Filter break_reminder_c.exe | Sort-Object LastWriteTimeUtc -Descending | Select-Object -First 1
          if (-not $exe) {
            throw 'No C executable was produced by the CMake build.'
          }

          "path=$($exe.FullName)" >> $env:GITHUB_OUTPUT
          "name=$($exe.Name)" >> $env:GITHUB_OUTPUT

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.executable.outputs.name }}
          path: ${{ steps.executable.outputs.path }}

      - name: Upload C executable to GitHub release
        if: github.event_name == 'release'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload ${{ github.event.release.tag_name }} "${{ steps.executable.outputs.path }}#${{ steps.executable.outputs.name }}" --clobber
